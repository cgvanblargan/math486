<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bernard against the trigger strategy</title>
<style>
  :root {
    --text-primary: #1a1a1a; --text-secondary: #4a5558; --text-muted: #5c6669;
    --surface-1: #f4f4f1; --surface-2: #ffffff;
    --border: #d5d8dc; --border-strong: #9aa3a8;
    --bg-accent: #e6f1fb; --text-accent: #0c447c; --border-accent: #378add;
    --bg-success: #eaf3de; --text-success: #17693a; --border-success: #639922;
    --bg-danger: #fcebeb; --text-danger: #a32d2d; --border-danger: #e24b4a;
    --bg-warning: #faeeda;
    --radius: 8px; --font-mono: ui-monospace, Menlo, Consolas, monospace;
  }
  body { margin: 0; padding: 10px 12px 16px; font-family: serif; background: transparent; color: var(--text-primary); font-size: 16px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  button, select { font-family: serif; font-size: 14px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--text-primary); background: white; color: var(--text-primary); cursor: pointer; }
  button:hover { background: var(--surface-1); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  input[type=range] { accent-color: #185fa5; }
  button.on, .pill.on { background: var(--text-primary); color: white; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
<style>
.wrap{max-width:720px;margin:0 auto}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;margin:0 0 4px}
caption{text-align:left;font-size:16px;font-weight:bold;padding:0 0 4px}
th,td{text-align:center;padding:2px 2px;font-weight:normal}
th[scope=row]{text-align:left;color:var(--text-secondary);width:92px;font-size:13px}
thead th{color:var(--text-secondary)}
.bx{height:44px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid var(--border-strong)}
.b{width:60%;background:#1D9E75;border-radius:2px 2px 0 0}
.tot{font-size:18px;font-weight:bold}
</style>
<div class="wrap">
<h1 class="sr-only">Bernard against the trigger strategy: using trigger himself versus always defecting</h1>
<div style="display:flex;align-items:center;gap:12px;margin:0 0 12px">
<label for="d" style="font-size:16px;color:var(--text-secondary)">Discount factor &delta;</label>
<input type="range" id="d" min="0.3" max="0.95" step="0.01" value="0.6" style="flex:1" aria-describedby="v"><output id="dO" for="d" style="font-size:16px;font-weight:bold;min-width:40px"></output></div>
<table id="t1"></table>
<table id="t2" style="margin-top:14px"></table>
<p style="font-size:13px;color:var(--text-muted);margin:6px 0 0">Outcomes are written (Merchant, Bernard).</p>
<p id="v" style="font-size:16px;margin:8px 0 0" aria-live="polite"></p>
</div>
<script>
const $=id=>document.getElementById(id);
function table(el,title,out,pay,d){
 let h=`<caption>${title}</caption><thead><tr><th scope="row">Round</th>`;
 for(let k=0;k<8;k++)h+=`<th scope="col">${k}</th>`;
 h+=`<th scope="col" aria-label="later rounds">&hellip;</th><th scope="col">Total</th></tr></thead><tbody><tr><th scope="row">Outcome</th>`;
 for(let k=0;k<8;k++)h+=`<td>${out(k)}</td>`;
 h+=`<td aria-hidden="true"></td><td></td></tr><tr><th scope="row">Bernard's payoff &times; &delta;<sup>k</sup></th>`;
 for(let k=0;k<8;k++){const w=Math.pow(d,k)*pay(k);h+=`<td><div class="bx" aria-hidden="true"><div class="b" style="height:${w/4*44}px"></div></div>${w.toFixed(2)}</td>`}
 const T=pay(1)?1/(1-d):4;
 h+=`<td aria-hidden="true">&hellip;</td><td class="tot">${T.toFixed(2)}</td></tr></tbody>`;
 el.innerHTML=h;return T}
function up(){const d=+$("d").value;$("dO").textContent=d.toFixed(2);
 const a=table($("t1"),"Both use trigger",k=>"(c, c)",k=>1,d);
 const b=table($("t2"),"Merchant uses trigger, Bernard always defects",k=>k?"(d, d)":"(c, d)",k=>k?0:4,d);
 $("v").textContent=a>=b-1e-9?`Bernard does better using trigger: ${a.toFixed(2)} versus 4.00.`:`Bernard does better always defecting: 4.00 versus ${a.toFixed(2)}.`}
$("d").oninput=up;up();
</script>

</main>
</body>
</html>
