<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisoner's Dilemma vs. Tit-for-Tat</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #5a6a6d;
    --panel-bg: #f7f7f5;
    --accent: #922b21;
    --good: #1e8449;
  }
  body { margin: 0; padding: 10px 14px 18px; font-family: serif; background: transparent; color: var(--ink); }
  h2 { text-align: center; font-size: 19px; margin: 4px 0 10px; }
  .panel {
    max-width: 640px; margin: 0 auto; background: var(--panel-bg); border: 1px solid #d5d8dc;
    border-radius: 10px; padding: 16px 20px; text-align: center;
  }
  .scoreboard { display: flex; justify-content: center; gap: 40px; margin-bottom: 14px; font-size: 16px; font-weight: bold; }
  .scoreboard .you { color: var(--accent); }
  .scoreboard .robot { color: var(--good); }
  .choice-row { display: flex; gap: 12px; justify-content: center; margin-top: 10px; }
  button.choice-btn {
    font-family: serif; font-size: 15px; padding: 9px 18px; border-radius: 8px;
    border: 1.5px solid var(--ink); background: white; color: var(--ink); cursor: pointer;
  }
  button.choice-btn:hover { background: #eef2f5; }
  button.refuse { border-color: var(--good); color: var(--good); font-weight: bold; }
  button.talk { border-color: var(--accent); color: var(--accent); font-weight: bold; }
  table { border-collapse: collapse; margin: 14px auto 0; font-size: 14px; }
  th, td { border: 1px solid #d5d8dc; padding: 5px 10px; }
  th { background: #eee; }
  .reset-row { margin-top: 14px; }
  .reset-btn {
    font-family: serif; font-size: 13px; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--muted); background: white; color: var(--muted); cursor: pointer;
  }
  .directions { font-size: 14.5px; color: var(--muted); text-align: left; margin: 0 0 14px; line-height: 1.5; }
  table.payoff-table { margin: 0 auto 16px; }
  table.payoff-table caption { font-size: 13px; color: var(--muted); margin-bottom: 4px; caption-side: top; }
  table.payoff-table th, table.payoff-table td { text-align: center; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

// payoffs: [you, robot], years in jail (negative = bad)
const PAYOFFS = {
  "refuse,refuse": [-1, -1],
  "refuse,talk": [-10, 0],
  "talk,refuse": [0, -10],
  "talk,talk": [-6, -6],
};

function robotMove(history) {
  if (history.length === 0) return "refuse"; // starts by cooperating
  return history[history.length - 1].you; // mirrors your last move
}

function App() {
  const [history, setHistory] = useState([]);
  const [youTotal, setYouTotal] = useState(0);
  const [robotTotal, setRobotTotal] = useState(0);
  const [status, setStatus] = useState("Round 1. Choose refuse or talk.");

  function play(youChoice) {
    const robotChoice = robotMove(history);
    const [yPay, rPay] = PAYOFFS[youChoice + "," + robotChoice];
    const round = history.length + 1;
    setHistory([...history, { you: youChoice, robot: robotChoice, yPay, rPay }]);
    setYouTotal(youTotal + yPay);
    setRobotTotal(robotTotal + rPay);
    setStatus(
      "Round " + round + ": you chose " + youChoice + ", the robot chose " + robotChoice +
      ". You get " + yPay + " years, the robot gets " + rPay + " years. Totals: you " +
      (youTotal + yPay) + " years, robot " + (robotTotal + rPay) + " years. Round " + (round + 1) +
      " now, choose refuse or talk."
    );
  }

  function reset() {
    setHistory([]);
    setYouTotal(0);
    setRobotTotal(0);
    setStatus("Round 1. Choose refuse or talk.");
  }

  return (
    <div>
      <h2>Play Prisoner's Dilemma Against a Robot</h2>
      <div className="panel">
        <p className="directions">
          Each round, you and the robot each secretly choose to <b>refuse</b>
          {" "}or <b>talk</b>, then both choices are revealed at once. Play at
          least three rounds before moving on.
        </p>

        <table className="payoff-table">
          <caption>Payoffs (years in jail; lower is better for you)</caption>
          <thead>
            <tr><th scope="col"></th><th scope="col">Robot: refuse</th><th scope="col">Robot: talk</th></tr>
          </thead>
          <tbody>
            <tr><th scope="row">You: refuse</th><td>&minus;1, &minus;1</td><td>&minus;10, 0</td></tr>
            <tr><th scope="row">You: talk</th><td>0, &minus;10</td><td>&minus;6, &minus;6</td></tr>
          </tbody>
        </table>

        <div className="scoreboard">
          <span className="you">You: {youTotal} years</span>
          <span className="robot">Robot: {robotTotal} years</span>
        </div>

        <p aria-hidden="true">Round {history.length + 1}. Refuse or talk?</p>
        <div className="choice-row" role="group" aria-label="Choose your move for this round">
          <button className="choice-btn refuse" onClick={() => play("refuse")}
            aria-label={"Refuse, round " + (history.length + 1)}>Refuse</button>
          <button className="choice-btn talk" onClick={() => play("talk")}
            aria-label={"Talk, round " + (history.length + 1)}>Talk</button>
        </div>

        <div className="sr-only" role="status" aria-live="polite">{status}</div>

        {history.length > 0 &&
          <table>
            <caption className="sr-only">Round-by-round results</caption>
            <thead>
              <tr><th scope="col">Round</th><th scope="col">You</th><th scope="col">Robot</th><th scope="col">Your years</th><th scope="col">Robot's years</th></tr>
            </thead>
            <tbody>
              {history.map((h, i) => (
                <tr key={i}>
                  <td>{i + 1}</td><td>{h.you}</td><td>{h.robot}</td><td>{h.yPay}</td><td>{h.rPay}</td>
                </tr>
              ))}
            </tbody>
          </table>
        }

        <div className="reset-row">
          <button className="reset-btn" onClick={reset}>Reset</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
