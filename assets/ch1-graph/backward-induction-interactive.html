<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backward Induction: Tony's Accident</title>
<style>
  :root {
    --ink: #1a1a1a;
    --path: #1e8449;
    --payoff: #922b21;
    --muted: #5a6a6d;
    --wrong-bg: #fdecea;
    --wrong-border: #c0392b;
    --correct-bg: #eafaf1;
    --correct-border: #1e8449;
    --panel-bg: #f7f7f5;
    --focus: #2563eb;
  }
  body {
    margin: 0;
    padding: 10px 12px 16px;
    font-family: serif;
    background: transparent;
    color: var(--ink);
  }
  svg { display: block; margin: 0 auto; max-width: 1050px; width: 100%; height: auto; }
  .edge { stroke: var(--ink); stroke-width: 1.5; fill: none; transition: opacity 0.3s, stroke 0.3s, stroke-width 0.3s; }
  .edge.pruned { opacity: 0.2; }
  .edge.chosen { stroke: var(--path); stroke-width: 4; }
  .action-label { font-size: 26px; fill: var(--ink); transition: opacity 0.3s; }
  .action-label.pruned { opacity: 0.25; text-decoration: line-through; }
  .action-label.chosen { fill: var(--path); font-weight: bold; }
  .node-dot { fill: var(--ink); transition: fill 0.3s; }
  .node-dot.chosen-node { fill: var(--path); }
  .node-dot.locked { fill: #b6bebf; }
  .player-label { font-size: 26px; fill: var(--ink); }
  .player-label.locked { fill: #b6bebf; }
  .payoff-pair { font-size: 27px; text-anchor: middle; fill: var(--payoff); font-weight: bold; }
  .payoff-pair.pruned { opacity: 0.25; }

  .panel {
    max-width: 700px;
    margin: 14px auto 0;
    padding: 14px 18px;
    background: var(--panel-bg);
    border: 1px solid #d5d8dc;
    border-radius: 10px;
  }
  .panel h3 {
    margin: 0 0 8px;
    font-size: 17px;
    color: var(--ink);
  }
  .panel p.instructions {
    margin: 0 0 12px;
    font-size: 15px;
    line-height: 1.4;
  }
  .choice-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .choice-btn {
    font-family: serif;
    font-size: 14.5px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--ink);
    background: white;
    color: var(--ink);
    cursor: pointer;
  }
  .choice-btn:hover { background: #eef2f5; }
  .choice-btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .choice-btn:disabled { cursor: default; opacity: 0.6; }

  .feedback {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14.5px;
    line-height: 1.4;
  }
  .feedback.wrong { background: var(--wrong-bg); border: 1px solid var(--wrong-border); }
  .feedback.correct { background: var(--correct-bg); border: 1px solid var(--correct-border); }
  .feedback .icon { font-weight: bold; margin-right: 4px; }

  .summary-box {
    max-width: 700px;
    margin: 14px auto 0;
    padding: 14px 18px;
    background: var(--correct-bg);
    border: 1.5px solid var(--correct-border);
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.5;
  }
  .summary-box h3 { margin: 0 0 8px; font-size: 17px; }
  .reset-row { text-align: center; margin-top: 12px; }
  .reset-btn {
    font-family: serif;
    font-size: 13.5px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--muted);
    background: white;
    color: var(--muted);
    cursor: pointer;
  }
  .reset-btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  .active-ring {
    fill: none;
    stroke: var(--focus);
    stroke-width: 5;
    stroke-dasharray: 6 4;
    animation: pulse-ring 1.4s ease-in-out infinite;
    display: none;
  }
  .active-label {
    font-size: 24px;
    font-weight: bold;
    fill: var(--focus);
    text-anchor: middle;
    display: none;
  }
  @keyframes pulse-ring {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<svg viewBox="0 0 1050 460" role="img" aria-label="Game tree for Tony's Accident, used to practice backward induction">
  <path class="edge" id="edge-send80" d="M660,60 L170,190"/>
  <path class="edge" id="edge-demand" d="M660,60 L465,190"/>
  <path class="edge" id="edge-send40" d="M660,60 L855,190"/>
  <path class="edge" id="edge-demand-repair" d="M465,190 L370,340"/>
  <path class="edge" id="edge-demand-norepair" d="M465,190 L560,340"/>
  <path class="edge" id="edge-send40-repair" d="M855,190 L760,340"/>
  <path class="edge" id="edge-send40-norepair" d="M855,190 L950,340"/>

  <text class="action-label" x="395" y="118" text-anchor="end">send $80</text>
  <text class="action-label" x="545" y="128" text-anchor="end">demand</text>
  <text class="action-label" x="568" y="128" text-anchor="start">receipt</text>
  <text class="action-label" x="775" y="118" text-anchor="start">send $40</text>
  <text class="action-label" id="lbl-demand-repair" x="410" y="252" text-anchor="end">repair</text>
  <text class="action-label" id="lbl-demand-norepair" x="518" y="252" text-anchor="start">don't repair</text>
  <text class="action-label" id="lbl-send40-repair" x="800" y="252" text-anchor="end">repair</text>
  <text class="action-label" id="lbl-send40-norepair" x="908" y="252" text-anchor="start">don't repair</text>

  <circle class="node-dot" id="node-root" cx="660" cy="60" r="5"/>
  <text class="player-label" x="670" y="52">Tony</text>

  <circle class="node-dot" id="node-demand" cx="465" cy="190" r="5"/>
  <text class="player-label" x="497" y="180">Vic</text>

  <circle class="node-dot" id="node-send40" cx="855" cy="190" r="5"/>
  <text class="player-label" x="865" y="182">Vic</text>

  <circle class="node-dot" cx="170" cy="190" r="5"/>
  <text class="payoff-pair" x="170" y="215">(&#8722;80, 80)</text>

  <circle class="node-dot" cx="370" cy="340" r="5"/>
  <text class="payoff-pair" id="pay-demand-repair" x="370" y="365">(&#8722;80, 20)</text>

  <circle class="node-dot" cx="560" cy="340" r="5"/>
  <text class="payoff-pair" id="pay-demand-norepair" x="560" y="365">(0, 0)</text>

  <circle class="node-dot" cx="760" cy="340" r="5"/>
  <text class="payoff-pair" id="pay-send40-repair" x="760" y="365">(&#8722;80, 20)</text>

  <circle class="node-dot" cx="950" cy="340" r="5"/>
  <text class="payoff-pair" id="pay-send40-norepair" x="950" y="365">(&#8722;40, 40)</text>

  <circle class="active-ring" id="active-ring" r="22" cx="0" cy="0"/>
  <text class="active-label" id="active-label" x="0" y="0">Deciding here</text>
</svg>

<div class="panel" id="panel">
  <h3 id="panel-title"></h3>
  <p class="instructions" id="panel-instructions"></p>
  <div class="choice-row" id="choice-row"></div>
  <div class="feedback" id="feedback" role="status" aria-live="polite" style="display:none;"></div>
</div>

<div class="summary-box" id="summary" style="display:none;" role="status" aria-live="polite"></div>

<div class="reset-row">
  <button class="reset-btn" id="reset-btn">Start over</button>
</div>

<div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>

<script>
  const state = { step: 0, vicDemand: null, vicSend40: null, tony: null };

  const rule = "Remember the rule: a rational player always takes the action with the strictly higher payoff to themself.";

  const steps = [
    {
      title: "Step 1 of 3: Vic's choice after \u201cdemand receipt\u201d",
      nodeCx: 465, nodeCy: 190, nodeLabelDx: -135, nodeLabelDy: -10,
      instructions: "If Tony demands a receipt, Vic ends up choosing between the two nodes on the left. Look at the highlighted node below, and at Vic's payoff (the second number) in each pair. What will a rational Vic do here? " + rule,
      choices: [
        { label: "Repair", correct: true, payoff: "20" },
        { label: "Don't repair", correct: false, payoff: "0" }
      ],
      onCorrect: () => {
        document.getElementById("edge-demand-norepair").classList.add("pruned");
        document.getElementById("lbl-demand-norepair").classList.add("pruned");
        document.getElementById("pay-demand-norepair").classList.add("pruned");
        document.getElementById("edge-demand-repair").classList.add("chosen");
        document.getElementById("lbl-demand-repair").classList.add("chosen");
        state.vicDemand = "repair";
      }
    },
    {
      title: "Step 2 of 3: Vic's choice after \u201csend $40\u201d",
      nodeCx: 855, nodeCy: 190, nodeLabelDx: 0, nodeLabelDy: -40,
      instructions: "Now suppose Tony sends $40 up front instead. Vic again has a choice at the highlighted node below, this time on the right side of the tree. What will a rational Vic do here? " + rule,
      choices: [
        { label: "Repair", correct: false, payoff: "20" },
        { label: "Don't repair", correct: true, payoff: "40" }
      ],
      onCorrect: () => {
        document.getElementById("edge-send40-repair").classList.add("pruned");
        document.getElementById("lbl-send40-repair").classList.add("pruned");
        document.getElementById("pay-send40-repair").classList.add("pruned");
        document.getElementById("edge-send40-norepair").classList.add("chosen");
        document.getElementById("lbl-send40-norepair").classList.add("chosen");
        state.vicSend40 = "don't repair";
      }
    },
    {
      title: "Step 3 of 3: Tony's choice at the root",
      nodeCx: 660, nodeCy: 60, nodeLabelDx: 0, nodeLabelDy: -38,
      instructions: "Now that Vic's responses are pinned down, Tony really only has three possible outcomes to compare, at the highlighted node below: sending $80 outright, demanding a receipt (which we now know ends in Vic repairing), or sending $40 (which now ends in Vic not repairing). Look at Tony's payoff (the first number) in each surviving outcome. What will a rational Tony do? " + rule,
      choices: [
        { label: "Send $80", correct: false, payoff: "\u221280" },
        { label: "Demand receipt", correct: false, payoff: "\u221280" },
        { label: "Send $40", correct: true, payoff: "\u221240" }
      ],
      onCorrect: () => {
        document.getElementById("edge-send80").classList.add("pruned");
        document.getElementById("edge-demand").classList.add("pruned");
        document.getElementById("lbl-demand-repair").classList.remove("chosen");
        document.getElementById("edge-demand-repair").classList.remove("chosen");
        document.getElementById("edge-demand-repair").classList.add("pruned");
        document.getElementById("pay-demand-repair").classList.add("pruned");
        document.getElementById("edge-send40").classList.add("chosen");
        state.tony = "send $40";
      }
    }
  ];

  const panelTitle = document.getElementById("panel-title");
  const panelInstructions = document.getElementById("panel-instructions");
  const choiceRow = document.getElementById("choice-row");
  const feedback = document.getElementById("feedback");
  const panel = document.getElementById("panel");
  const summary = document.getElementById("summary");
  const srStatus = document.getElementById("sr-status");

  const activeRing = document.getElementById("active-ring");
  const activeLabel = document.getElementById("active-label");

  function showActiveNode(s) {
    activeRing.setAttribute("cx", s.nodeCx);
    activeRing.setAttribute("cy", s.nodeCy);
    activeRing.style.display = "block";
    activeLabel.setAttribute("x", s.nodeCx + s.nodeLabelDx);
    activeLabel.setAttribute("y", s.nodeCy + s.nodeLabelDy);
    activeLabel.style.display = "block";
  }

  function hideActiveNode() {
    activeRing.style.display = "none";
    activeLabel.style.display = "none";
  }

  function renderStep() {
    const s = steps[state.step];
    panelTitle.textContent = s.title;
    panelInstructions.textContent = s.instructions;
    feedback.style.display = "none";
    choiceRow.innerHTML = "";
    showActiveNode(s);
    s.choices.forEach((choice) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = choice.label;
      btn.addEventListener("click", () => handleChoice(choice, s));
      choiceRow.appendChild(btn);
    });
    srStatus.textContent = s.title + ". " + s.instructions;
  }

  function handleChoice(choice, s) {
    if (choice.correct) {
      feedback.className = "feedback correct";
      feedback.innerHTML = '<span class="icon">Correct.</span> ' + choice.label +
        " gives a payoff of " + choice.payoff + ", which is the best available option here.";
      feedback.style.display = "block";
      srStatus.textContent = feedback.textContent;
      s.onCorrect();
      Array.from(choiceRow.children).forEach(b => b.disabled = true);
      state.step += 1;
      setTimeout(() => {
        if (state.step < steps.length) {
          renderStep();
        } else {
          showSummary();
        }
      }, 1600);
    } else {
      const correctChoice = s.choices.find(c => c.correct);
      feedback.className = "feedback wrong";
      feedback.innerHTML = '<span class="icon">Not quite.</span> ' + choice.label +
        " gives a payoff of " + choice.payoff + ", but " + correctChoice.label +
        " gives " + correctChoice.payoff + ", which is better. A rational player takes the better payoff. Try again.";
      feedback.style.display = "block";
      srStatus.textContent = feedback.textContent;
    }
  }

  function showSummary() {
    hideActiveNode();
    panel.style.display = "none";
    summary.style.display = "block";
    summary.innerHTML = "<h3>Result</h3>" +
      "<p>Working backward, you found: Vic will repair if Tony demands a receipt, and Vic will not repair if Tony sends $40. " +
      "Knowing that, Tony's best move is to send $40 outright.</p>" +
      "<p>So backward induction predicts Tony plays <strong>send $40</strong>, Vic plays <strong>(repair if demand receipt, don't repair if send $40)</strong>, " +
      "and the game ends with payoffs <strong>(\u221240, 40)</strong>. This is exactly how the game played out in the book.</p>";
    srStatus.textContent = summary.textContent;
  }

  function reset() {
    state.step = 0;
    state.vicDemand = null;
    state.vicSend40 = null;
    state.tony = null;
    document.querySelectorAll(".edge, .action-label, .payoff-pair, .node-dot")
      .forEach(el => el.classList.remove("pruned", "chosen", "chosen-node"));
    panel.style.display = "block";
    summary.style.display = "none";
    renderStep();
  }

  document.getElementById("reset-btn").addEventListener("click", reset);

  renderStep();
</script>

</body>
</html>
