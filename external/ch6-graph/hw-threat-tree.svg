<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 245" width="680" height="245" role="img" aria-labelledby="t d" font-family="serif">
<title id="t">Game tree for the exercise on subgame perfection</title>
<desc id="d">At the root, Player 1 (labeled P1) chooses U or D. If Player 1 chooses U, Player 2 (labeled P2) chooses at node n1: x gives payoffs (2, 3), and y gives (0, 1). If Player 1 chooses D, Player 2 chooses at node n2: x gives (1, 0), and y gives (3, 2). Payoffs are listed as (Player 1, Player 2).</desc>
<rect width="680" height="245" fill="white"/>
<line x1="340" y1="30" x2="170" y2="120" stroke="#3d3d3a" stroke-width="1.5"/>
<text x="245.0" y="75.0" text-anchor="end" font-size="15" font-style="italic" fill="#3d3d3a">U</text>
<line x1="340" y1="30" x2="510" y2="120" stroke="#3d3d3a" stroke-width="1.5"/>
<text x="435.0" y="75.0" text-anchor="start" font-size="15" font-style="italic" fill="#3d3d3a">D</text>
<line x1="170" y1="120" x2="90" y2="210" stroke="#3d3d3a" stroke-width="1.5"/>
<text x="120.0" y="165.0" text-anchor="end" font-size="15" font-style="italic" fill="#3d3d3a">x</text>
<line x1="170" y1="120" x2="250" y2="210" stroke="#3d3d3a" stroke-width="1.5"/>
<text x="220.0" y="165.0" text-anchor="start" font-size="15" font-style="italic" fill="#3d3d3a">y</text>
<line x1="510" y1="120" x2="430" y2="210" stroke="#3d3d3a" stroke-width="1.5"/>
<text x="460.0" y="165.0" text-anchor="end" font-size="15" font-style="italic" fill="#3d3d3a">x</text>
<line x1="510" y1="120" x2="590" y2="210" stroke="#3d3d3a" stroke-width="1.5"/>
<text x="560.0" y="165.0" text-anchor="start" font-size="15" font-style="italic" fill="#3d3d3a">y</text>
<circle cx="340" cy="30" r="18" fill="white" stroke="#1a1a1a"/>
<text x="314" y="35" text-anchor="end" font-size="16" fill="#1a1a1a"><tspan>P</tspan><tspan font-size="11" dy="4">1</tspan></text>
<circle cx="170" cy="120" r="18" fill="white" stroke="#1a1a1a"/><text x="168" y="124" text-anchor="middle" font-size="16" fill="#1a1a1a"><tspan font-style="italic">n</tspan><tspan font-size="11" dy="4">1</tspan></text>
<text x="144" y="125" text-anchor="end" font-size="16" fill="#1a1a1a"><tspan>P</tspan><tspan font-size="11" dy="4">2</tspan></text>
<circle cx="510" cy="120" r="18" fill="white" stroke="#1a1a1a"/><text x="508" y="124" text-anchor="middle" font-size="16" fill="#1a1a1a"><tspan font-style="italic">n</tspan><tspan font-size="11" dy="4">2</tspan></text>
<text x="536" y="125" text-anchor="start" font-size="16" fill="#1a1a1a"><tspan>P</tspan><tspan font-size="11" dy="4">2</tspan></text>
<text x="90" y="232" text-anchor="middle" font-size="16" fill="#1a1a1a">(2, 3)</text>
<text x="250" y="232" text-anchor="middle" font-size="16" fill="#1a1a1a">(0, 1)</text>
<text x="430" y="232" text-anchor="middle" font-size="16" fill="#1a1a1a">(1, 0)</text>
<text x="590" y="232" text-anchor="middle" font-size="16" fill="#1a1a1a">(3, 2)</text>
</svg>
