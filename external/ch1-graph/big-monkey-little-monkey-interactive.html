<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backward Induction: Big Monkey and Little Monkey</title>
<style>
  :root {
    --ink: #1a1a1a;
    --path: #1e8449;
    --payoff: #922b21;
    --muted: #5a6a6d;
    --wrong-bg: #fdecea;
    --wrong-border: #c0392b;
    --correct-bg: #eafaf1;
    --correct-border: #1e8449;
    --panel-bg: #f7f7f5;
    --focus: #2563eb;
  }
  body {
    margin: 0;
    padding: 10px 12px 16px;
    font-family: serif;
    background: transparent;
    color: var(--ink);
  }
  svg { display: block; margin: 0 auto; max-width: 1050px; width: 100%; height: auto; }
  .edge { stroke: var(--ink); stroke-width: 1.5; fill: none; transition: opacity 0.3s, stroke 0.3s, stroke-width 0.3s; }
  .edge.pruned { opacity: 0.2; }
  .edge.chosen { stroke: var(--path); stroke-width: 4; }
  .action-label { font-size: 26px; fill: var(--ink); transition: opacity 0.3s; }
  .action-label.pruned { opacity: 0.25; text-decoration: line-through; }
  .action-label.chosen { fill: var(--path); font-weight: bold; }
  .node-dot { fill: var(--ink); transition: fill 0.3s; }
  .player-label { font-size: 26px; fill: var(--ink); }
  .payoff-pair { font-size: 27px; text-anchor: middle; fill: var(--payoff); font-weight: bold; }
  .payoff-pair.pruned { opacity: 0.25; }

  .panel {
    max-width: 700px;
    margin: 14px auto 0;
    padding: 14px 18px;
    background: var(--panel-bg);
    border: 1px solid #d5d8dc;
    border-radius: 10px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 17px; color: var(--ink); }
  .panel p.instructions { margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice-btn {
    font-family: serif;
    font-size: 14.5px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--ink);
    background: white;
    color: var(--ink);
    cursor: pointer;
  }
  .choice-btn:hover { background: #eef2f5; }
  .choice-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .choice-btn:disabled { cursor: default; opacity: 0.6; }

  .feedback { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; }
  .feedback.wrong { background: var(--wrong-bg); border: 1px solid var(--wrong-border); }
  .feedback.correct { background: var(--correct-bg); border: 1px solid var(--correct-border); }
  .feedback .icon { font-weight: bold; margin-right: 4px; }

  .summary-box {
    max-width: 700px;
    margin: 14px auto 0;
    padding: 14px 18px;
    background: var(--correct-bg);
    border: 1.5px solid var(--correct-border);
    border-radius: 10px;
    font-size: 15px;
    line-height: 1.5;
  }
  .summary-box h3 { margin: 0 0 8px; font-size: 17px; }
  .reset-row { text-align: center; margin-top: 12px; }
  .reset-btn {
    font-family: serif;
    font-size: 13.5px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--muted);
    background: white;
    color: var(--muted);
    cursor: pointer;
  }
  .reset-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .active-ring {
    fill: none;
    stroke: var(--focus);
    stroke-width: 5;
    stroke-dasharray: 6 4;
    animation: pulse-ring 1.4s ease-in-out infinite;
    display: none;
  }
  .active-label {
    font-size: 34px;
    font-weight: bold;
    fill: var(--focus);
    text-anchor: middle;
    display: none;
  }
  @keyframes pulse-ring {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<h2 style="text-align:center; font-family:serif; font-size:20px; margin:4px 0 12px; color:var(--ink);">Backward Induction for Big Monkey and Little Monkey</h2>

<svg viewBox="0 0 1050 460" role="img" aria-label="Game tree for Big Monkey and Little Monkey, used to practice backward induction">
  <path class="edge" id="edge-root-wait" d="M525,60 L300,190"/>
  <path class="edge" id="edge-root-climb" d="M525,60 L750,190"/>
  <path class="edge" id="edge-l1-wait" d="M300,190 L150,340"/>
  <path class="edge" id="edge-l1-climb" d="M300,190 L450,340"/>
  <path class="edge" id="edge-l2-wait" d="M750,190 L600,340"/>
  <path class="edge" id="edge-l2-climb" d="M750,190 L900,340"/>

  <text class="action-label" x="415" y="115" text-anchor="end">wait</text>
  <text class="action-label" x="635" y="115" text-anchor="start">climb</text>
  <text class="action-label" id="lbl-l1-wait" x="225" y="252" text-anchor="end">wait</text>
  <text class="action-label" id="lbl-l1-climb" x="375" y="252" text-anchor="start">climb</text>
  <text class="action-label" id="lbl-l2-wait" x="675" y="252" text-anchor="end">wait</text>
  <text class="action-label" id="lbl-l2-climb" x="825" y="252" text-anchor="start">climb</text>

  <circle class="node-dot" id="node-root" cx="525" cy="60" r="5"/>
  <text class="player-label" x="535" y="52">Big Monkey</text>

  <circle class="node-dot" id="node-l1" cx="300" cy="190" r="5"/>
  <text class="player-label" x="340" y="180">Little Monkey</text>

  <circle class="node-dot" id="node-l2" cx="750" cy="190" r="5"/>
  <text class="player-label" x="782" y="182">Little Monkey</text>

  <circle class="node-dot" cx="150" cy="340" r="5"/>
  <text class="payoff-pair" id="pay-l1-wait" x="150" y="365">(0, 0)</text>

  <circle class="node-dot" cx="450" cy="340" r="5"/>
  <text class="payoff-pair" id="pay-l1-climb" x="450" y="365">(9, 1)</text>

  <circle class="node-dot" cx="600" cy="340" r="5"/>
  <text class="payoff-pair" id="pay-l2-wait" x="600" y="365">(4, 4)</text>

  <circle class="node-dot" cx="900" cy="340" r="5"/>
  <text class="payoff-pair" id="pay-l2-climb" x="900" y="365">(5, 3)</text>

  <circle class="active-ring" id="active-ring" r="22" cx="0" cy="0"/>
  <text class="active-label" id="active-label" x="0" y="0">Deciding here</text>
</svg>

<div class="panel" id="panel">
  <h3 id="panel-title"></h3>
  <p class="instructions" id="panel-instructions"></p>
  <div class="choice-row" id="choice-row"></div>
  <div class="feedback" id="feedback" role="status" aria-live="polite" style="display:none;"></div>
</div>

<div class="summary-box" id="summary" style="display:none;" role="status" aria-live="polite"></div>

<div class="reset-row">
  <button class="reset-btn" id="reset-btn">Start over</button>
</div>

<div class="sr-only" id="sr-status" role="status" aria-live="polite"></div>

<script>
  const state = { step: 0 };
  const rule = "Remember the rule: a rational player always takes the action with the strictly higher payoff to themself.";

  const steps = [
    {
      title: "Step 1 of 3: Little Monkey's choice, if Big Monkey waits",
      nodeCx: 300, nodeCy: 190, nodeLabelDx: -135, nodeLabelDy: -10,
      instructions: "Suppose Big Monkey waits. Little Monkey now has to choose, at the highlighted node below. Look at Little Monkey's payoff (the second number) in each pair below. What will a rational Little Monkey do here? " + rule,
      choices: [
        { label: "Wait", correct: false, payoff: "0" },
        { label: "Climb", correct: true, payoff: "1" }
      ],
      onCorrect: () => {
        document.getElementById("edge-l1-wait").classList.add("pruned");
        document.getElementById("lbl-l1-wait").classList.add("pruned");
        document.getElementById("pay-l1-wait").classList.add("pruned");
        document.getElementById("edge-l1-climb").classList.add("chosen");
        document.getElementById("lbl-l1-climb").classList.add("chosen");
      }
    },
    {
      title: "Step 2 of 3: Little Monkey's choice, if Big Monkey climbs",
      nodeCx: 750, nodeCy: 190, nodeLabelDx: 0, nodeLabelDy: -40,
      instructions: "Now suppose Big Monkey climbs instead. Little Monkey again has a choice at the highlighted node below, this time on the right side of the tree. What will a rational Little Monkey do here? " + rule,
      choices: [
        { label: "Wait", correct: true, payoff: "4" },
        { label: "Climb", correct: false, payoff: "3" }
      ],
      onCorrect: () => {
        document.getElementById("edge-l2-climb").classList.add("pruned");
        document.getElementById("lbl-l2-climb").classList.add("pruned");
        document.getElementById("pay-l2-climb").classList.add("pruned");
        document.getElementById("edge-l2-wait").classList.add("chosen");
        document.getElementById("lbl-l2-wait").classList.add("chosen");
      }
    },
    {
      title: "Step 3 of 3: Big Monkey's choice at the root",
      nodeCx: 525, nodeCy: 60, nodeLabelDx: 0, nodeLabelDy: -38,
      instructions: "Now that Little Monkey's responses are pinned down, Big Monkey really only has two outcomes to compare, at the highlighted node below: waiting (which we now know ends with Little Monkey climbing) or climbing (which now ends with Little Monkey waiting). Look at Big Monkey's payoff (the first number) in each surviving outcome. What will a rational Big Monkey do? " + rule,
      choices: [
        { label: "Wait", correct: true, payoff: "9" },
        { label: "Climb", correct: false, payoff: "4" }
      ],
      onCorrect: () => {
        document.getElementById("edge-root-climb").classList.add("pruned");
        document.getElementById("lbl-l2-wait").classList.remove("chosen");
        document.getElementById("edge-l2-wait").classList.remove("chosen");
        document.getElementById("edge-l2-wait").classList.add("pruned");
        document.getElementById("pay-l2-wait").classList.add("pruned");
        document.getElementById("edge-root-wait").classList.add("chosen");
      }
    }
  ];

  const panelTitle = document.getElementById("panel-title");
  const panelInstructions = document.getElementById("panel-instructions");
  const choiceRow = document.getElementById("choice-row");
  const feedback = document.getElementById("feedback");
  const panel = document.getElementById("panel");
  const summary = document.getElementById("summary");
  const srStatus = document.getElementById("sr-status");

  const activeRing = document.getElementById("active-ring");
  const activeLabel = document.getElementById("active-label");

  function showActiveNode(s) {
    activeRing.setAttribute("cx", s.nodeCx);
    activeRing.setAttribute("cy", s.nodeCy);
    activeRing.style.display = "block";
    activeLabel.setAttribute("x", s.nodeCx + s.nodeLabelDx);
    activeLabel.setAttribute("y", s.nodeCy + s.nodeLabelDy);
    activeLabel.style.display = "block";
  }

  function hideActiveNode() {
    activeRing.style.display = "none";
    activeLabel.style.display = "none";
  }

  function renderStep() {
    const s = steps[state.step];
    panelTitle.textContent = s.title;
    panelInstructions.textContent = s.instructions;
    feedback.style.display = "none";
    choiceRow.innerHTML = "";
    showActiveNode(s);
    s.choices.forEach((choice) => {
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = choice.label;
      btn.addEventListener("click", () => handleChoice(choice, s));
      choiceRow.appendChild(btn);
    });
    srStatus.textContent = s.title + ". " + s.instructions;
  }

  function handleChoice(choice, s) {
    if (choice.correct) {
      feedback.className = "feedback correct";
      feedback.innerHTML = '<span class="icon">Correct.</span> ' + choice.label +
        " gives a payoff of " + choice.payoff + ", which is the best available option here.";
      feedback.style.display = "block";
      srStatus.textContent = feedback.textContent;
      s.onCorrect();
      Array.from(choiceRow.children).forEach(b => b.disabled = true);
      state.step += 1;
      setTimeout(() => {
        if (state.step < steps.length) {
          renderStep();
        } else {
          showSummary();
        }
      }, 1600);
    } else {
      const correctChoice = s.choices.find(c => c.correct);
      feedback.className = "feedback wrong";
      feedback.innerHTML = '<span class="icon">Not quite.</span> ' + choice.label +
        " gives a payoff of " + choice.payoff + ", but " + correctChoice.label +
        " gives " + correctChoice.payoff + ", which is better. A rational player takes the better payoff. Try again.";
      feedback.style.display = "block";
      srStatus.textContent = feedback.textContent;
    }
  }

  function showSummary() {
    hideActiveNode();
    panel.style.display = "none";
    summary.style.display = "block";
    summary.innerHTML = "<h3>Result</h3>" +
      "<p>Working backward, you found: if Big Monkey waits, Little Monkey climbs. If Big Monkey climbs, Little Monkey waits.</p>" +
      "<p>Knowing that, Big Monkey's best move is to wait: a payoff of 9 beats the 4 he'd get by climbing. " +
      "So backward induction predicts Big Monkey plays <strong>wait</strong>, Little Monkey plays " +
      "<strong>(climb if Big Monkey waits, wait if Big Monkey climbs)</strong>, and the game ends with payoffs <strong>(9, 1)</strong>.</p>";
    srStatus.textContent = summary.textContent;
  }

  function reset() {
    state.step = 0;
    document.querySelectorAll(".edge, .action-label, .payoff-pair, .node-dot")
      .forEach(el => el.classList.remove("pruned", "chosen"));
    panel.style.display = "block";
    summary.style.display = "none";
    renderStep();
  }

  document.getElementById("reset-btn").addEventListener("click", reset);

  renderStep();
</script>

</body>
</html>
