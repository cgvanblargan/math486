<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finding Nash Equilibria by Inspection: Prisoner's Dilemma</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #5a6a6d;
    --panel-bg: #f7f7f5;
    --accent: #1a5276;
    --improve: #922b21;
    --stable: #1e8449;
    --line: #d5d8dc;
  }
  html, body { overflow: hidden; }
  body {
    margin: 0; padding: 0;
    font-family: serif;
    background: transparent;
    color: var(--ink);
  }
  /* Fixed design canvas: laid out at 700x840, then scaled to the iframe width. */
  #fit {
    width: 700px; height: 840px;
    padding: 8px 14px 16px;
    box-sizing: border-box;
    transform-origin: top left;
  }
  .step-bar {
    max-width: 640px; margin: 0 auto 4px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14.5px; color: var(--muted);
  }
  svg { display: block; margin: 0 auto; }

  .cell-box { fill: #ffffff; stroke: var(--line); stroke-width: 1.5; }
  .cell-box.current { fill: #dce9f5; stroke: var(--accent); stroke-width: 3; }
  .cell-box.target  { fill: #f5efe7; stroke: var(--muted); stroke-width: 2; stroke-dasharray: 5 3; }
  .cell-box.done-no { fill: #faf1f0; stroke: #c8a5a1; stroke-width: 1.5; }
  .cell-box.done-ne { fill: #eef6f0; stroke: var(--stable); stroke-width: 2.5; }

  .payoff-text { font-size: 21px; fill: var(--ink); text-anchor: middle; }
  .payoff-text.faded { fill: #8a8a8a; }
  .cell-label { font-size: 11.5px; text-anchor: middle; }
  .cell-label.ne { fill: var(--stable); font-weight: bold; }
  .cell-label.no { fill: var(--improve); }
  .strat-label { font-size: 17px; fill: var(--ink); }
  .player-label { font-size: 17px; font-weight: bold; fill: var(--accent); }

  .qbox {
    max-width: 640px; margin: 8px auto 0;
    background: var(--panel-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    box-sizing: border-box;
    height: 430px;
    overflow-y: auto;
  }
  .qbox h3 { margin: 0 0 6px; font-size: 17px; color: var(--accent); }
  .qbox .stem { margin: 0 0 10px; font-size: 16px; line-height: 1.45; }
  .opts { display: flex; flex-direction: column; gap: 7px; }
  .opt {
    font-family: serif; font-size: 15.5px; text-align: left;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #ffffff; color: var(--ink); cursor: pointer; line-height: 1.35;
  }
  .opt:hover:not(:disabled) { background: #eef3f8; }
  .opt:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  .opt.wrong { background: #faf1f0; border-color: #c8a5a1; color: var(--muted); }
  .opt:disabled { cursor: default; }

  .chosen {
    font-size: 15.5px; margin: 0 0 10px; padding: 8px 12px;
    background: #eef6f0; border: 1px solid #bcd9c6; border-radius: 8px;
  }
  .chosen .lab { font-weight: bold; color: var(--stable); }

  .fb { font-size: 15.5px; line-height: 1.55; }
  .fb .ineq-row {
    margin: 8px 0; padding: 8px 12px; border-radius: 8px;
    background: #ffffff; border: 1px solid var(--line);
  }
  .fb .ineq-row.fails { border-left: 4px solid var(--improve); }
  .fb .ineq-row.holds { border-left: 4px solid var(--stable); }
  .fb .ineq { font-size: 16px; }
  .fb .who { font-weight: bold; }
  .fb .verdict { margin-top: 10px; }
  .fb .verdict b.no { color: var(--improve); }
  .fb .verdict b.ne { color: var(--stable); }

  .summary {
    margin-top: 10px;
    background: #eef6f0; border: 1px solid #bcd9c6;
    border-left: 5px solid var(--stable);
    border-radius: 8px; padding: 11px 14px;
    font-size: 15.5px; line-height: 1.5;
  }
  .summary b { color: var(--stable); }

  .controls {
    max-width: 640px; margin: 9px auto 0;
    display: flex; justify-content: space-between; gap: 12px;
  }
  button.nav {
    font-family: serif; font-size: 15px; padding: 7px 18px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #ffffff; color: var(--accent); cursor: pointer;
  }
  button.nav:hover:not(:disabled) { background: var(--panel-bg); }
  button.nav:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  button.nav:disabled { color: #b0b0b0; cursor: default; }
  button.nav.primary { border-color: var(--accent); font-weight: bold; }
</style>
</head>
<body>

<div id="fit">
  <div class="step-bar">
    <span id="step-text">Profile 1 of 4</span>
    <span>Inspection means checking every profile, not just the promising ones.</span>
  </div>

  <svg id="board" width="660" height="305" viewBox="0 0 660 305" role="group"
       aria-label="Prisoner's Dilemma payoff matrix"></svg>

  <div class="qbox" id="qbox"></div>

  <div class="controls">
    <button class="nav" id="restart" type="button">Start over</button>
    <button class="nav primary" id="next" type="button" disabled>Next profile</button>
  </div>
</div>

<script>
  // Scale to fit BOTH dimensions, so the canvas never overflows its container
  // no matter what aspect ratio the iframe ends up with.
  function fitToBox() {
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var k = Math.min(vw / 700, vh / 840);
    var tx = Math.max(0, (vw - 700 * k) / 2);
    document.getElementById("fit").style.transform =
      "translateX(" + tx + "px) scale(" + k + ")";
  }
  window.addEventListener("resize", fitToBox);
  fitToBox();
</script>

<script>
(function () {
  "use strict";

  var SVGNS = "http://www.w3.org/2000/svg";
  var MINUS = "\u2212";

  // Prisoner's Dilemma, Sections 2.1 and 3.2.1.
  // Row player is Executive 1, column player is Executive 2.
  var STRATS = ["refuse", "talk"];
  var PAY = [
    [[-1, -1], [-10, 0]],
    [[0, -10], [-6, -6]]
  ];

  // Three profiles are worked in full. The fourth is the mirror image of the
  // first, so it is handled by a short symmetry check instead.
  var STEPS = [
    { i: 1, j: 0, kind: "full" },
    { i: 0, j: 1, kind: "symmetry", mirror: [1, 0] },
    { i: 1, j: 1, kind: "full" },
    { i: 0, j: 0, kind: "full" }
  ];

  var X0 = 250, Y0 = 120, CW = 150, CH = 84;
  var colC = [X0 + CW / 2, X0 + CW + CW / 2];
  var rowC = [Y0 + CH / 2, Y0 + CH + CH / 2];

  var step = 0;
  var resolved = {};
  var answered = false;

  var svg = document.getElementById("board");
  var qbox = document.getElementById("qbox");
  var stepText = document.getElementById("step-text");
  var nextBtn = document.getElementById("next");

  function el(name, attrs, text) {
    var n = document.createElementNS(SVGNS, name);
    for (var k in attrs) { n.setAttribute(k, attrs[k]); }
    if (text !== undefined) { n.textContent = text; }
    return n;
  }
  function num(x) { return x < 0 ? MINUS + Math.abs(x) : String(x); }
  function pairText(p) { return "(" + num(p[0]) + ", " + num(p[1]) + ")"; }
  function profName(i, j) { return "(" + STRATS[i] + ", " + STRATS[j] + ")"; }
  function piLabel(who, i, j) {
    var sub = who === 0 ? "\u2081" : "\u2082";
    return "\u03C0" + sub + "(" + STRATS[i] + ", " + STRATS[j] + ")";
  }
  function key(i, j) { return i + "-" + j; }
  function exName(who) { return who === 0 ? "Executive 1" : "Executive 2"; }

  function devOf(who, i, j) {
    return who === 0 ? [1 - i, j] : [i, 1 - j];
  }
  function improves(who, i, j) {
    var d = devOf(who, i, j);
    return PAY[d[0]][d[1]][who] > PAY[i][j][who];
  }
  function isNE(i, j) { return !improves(0, i, j) && !improves(1, i, j); }

  function buildBoard() {
    svg.appendChild(el("text", {
      x: X0 + CW, y: 62, "text-anchor": "middle", class: "player-label"
    }, "Executive 2"));
    for (var j = 0; j < 2; j++) {
      svg.appendChild(el("text", {
        x: colC[j], y: 98, "text-anchor": "middle", class: "strat-label"
      }, STRATS[j]));
    }
    svg.appendChild(el("text", {
      x: 118, y: Y0 + CH, "text-anchor": "middle", class: "player-label",
      transform: "rotate(-90 118 " + (Y0 + CH) + ")"
    }, "Executive 1"));
    for (var i = 0; i < 2; i++) {
      svg.appendChild(el("text", {
        x: 234, y: rowC[i] + 6, "text-anchor": "end", class: "strat-label"
      }, STRATS[i]));
    }
    for (var r = 0; r < 2; r++) {
      for (var c = 0; c < 2; c++) {
        svg.appendChild(el("rect", {
          x: X0 + c * CW, y: Y0 + r * CH, width: CW, height: CH,
          rx: 4, class: "cell-box", "data-cell": key(r, c)
        }));
        svg.appendChild(el("text", {
          x: colC[c], y: rowC[r] + 1, class: "payoff-text", "data-pay": key(r, c)
        }, pairText(PAY[r][c])));
        svg.appendChild(el("text", {
          x: colC[c], y: Y0 + r * CH + CH - 12, class: "cell-label",
          "data-label": key(r, c)
        }, ""));
      }
    }
  }

  function paintBoard() {
    var live = step < STEPS.length;
    var cur = live ? STEPS[step] : null;

    for (var i = 0; i < 2; i++) {
      for (var j = 0; j < 2; j++) {
        var box = svg.querySelector('[data-cell="' + key(i, j) + '"]');
        var pay = svg.querySelector('[data-pay="' + key(i, j) + '"]');
        var lab = svg.querySelector('[data-label="' + key(i, j) + '"]');
        var cls = "cell-box";
        var faded = true;

        if (resolved[key(i, j)]) {
          cls += isNE(i, j) ? " done-ne" : " done-no";
          lab.textContent = isNE(i, j) ? "Nash equilibrium" : "not a Nash equilibrium";
          lab.setAttribute("class", "cell-label " + (isNE(i, j) ? "ne" : "no"));
        } else {
          lab.textContent = "";
        }

        if (live) {
          if (i === cur.i && j === cur.j) {
            cls = "cell-box current";
            faded = false;
          } else if (!answered &&
                     ((i !== cur.i && j === cur.j) || (i === cur.i && j !== cur.j))) {
            cls = "cell-box target";
            faded = false;
          }
        } else {
          faded = false;
        }

        box.setAttribute("class", cls);
        pay.setAttribute("class", "payoff-text" + (faded && live ? " faded" : ""));
      }
    }
  }

  // One boxed line showing a single executive's comparison.
  function ineqRow(who, i, j) {
    var cur = PAY[i][j][who];
    var d = devOf(who, i, j);
    var dev = PAY[d[0]][d[1]][who];
    var gains = dev > cur;
    var sym = gains ? " &lt; " : (dev === cur ? " = " : " &gt; ");
    var to = who === 0 ? STRATS[1 - i] : STRATS[1 - j];
    var tail = gains
      ? "so switching to <i>" + to + "</i> raises this payoff. The definition fails here."
      : "so switching to <i>" + to + "</i> does not raise this payoff. The definition holds here.";
    return '<div class="ineq-row ' + (gains ? "fails" : "holds") + '">' +
           '<span class="who">' + exName(who) + ':</span> ' +
           '<span class="ineq">' + piLabel(who, i, j) + " = " + num(cur) + sym +
           num(dev) + " = " + piLabel(who, d[0], d[1]) + "</span>, " + tail + "</div>";
  }

  function onlyOpt(who, i, j) {
    var to = who === 0 ? STRATS[1 - i] : STRATS[1 - j];
    return {
      text: "Only " + exName(who) + ", who is better off switching to " + to,
      p1: who === 0,
      p2: who === 1
    };
  }
  function fullOptions(i, j) {
    return [
      onlyOpt(0, i, j),
      onlyOpt(1, i, j),
      { text: "Both of them are better off switching",   p1: true,  p2: true },
      { text: "Neither of them is better off switching", p1: false, p2: false }
    ];
  }
  // The two-option shortcut has to contain the right answer. When exactly one
  // player gains, the real question is which one, so the pair is the two "Only"
  // options. When both gain or neither does, that distinction is empty and the
  // pair becomes Both against Neither.
  function symmetryOptions(i, j) {
    if (improves(0, i, j) !== improves(1, i, j)) {
      return [onlyOpt(0, i, j), onlyOpt(1, i, j)];
    }
    return [
      { text: "Both of them are better off switching",   p1: true,  p2: true },
      { text: "Neither of them is better off switching", p1: false, p2: false }
    ];
  }

  function render() {
    if (step >= STEPS.length) { return finish(); }
    var s = STEPS[step];
    answered = false;
    paintBoard();
    stepText.textContent = "Profile " + (step + 1) + " of 4";
    nextBtn.disabled = true;

    var stem, opts;
    if (s.kind === "symmetry") {
      var m = s.mirror;
      stem = "This profile is the mirror image of " + profName(m[0], m[1]) +
             ", which you just checked. The game is symmetric: the two executives " +
             "have the same strategies and face the same payoffs, so swapping their " +
             "roles turns one profile into the other. You should be able to name the " +
             "answer without redoing the arithmetic.";
      opts = symmetryOptions(s.i, s.j);
    } else {
      stem = "Suppose the executives are at this profile. Is either one better off " +
             "changing strategy on their own, with the other staying put? The two " +
             "dashed cells show where each change would land.";
      opts = fullOptions(s.i, s.j);
    }

    qbox.innerHTML =
      "<h3>The profile " + profName(s.i, s.j) + ", payoffs " + pairText(PAY[s.i][s.j]) +
      "</h3><p class=\"stem\">" + stem + "</p>" +
      "<div class=\"opts\" id=\"opts\"></div><div class=\"fb\" id=\"fb\"></div>";

    var wrap = document.getElementById("opts");
    opts.forEach(function (o, idx) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      b.textContent = o.text;
      b.addEventListener("click", function () { choose(o, idx, s); });
      wrap.appendChild(b);
    });
  }

  function choose(pick, idx, s) {
    var i = s.i, j = s.j;
    var a1 = improves(0, i, j), a2 = improves(1, i, j);
    var fb = document.getElementById("fb");

    if (pick.p1 !== a1 || pick.p2 !== a2) {
      var btns = qbox.querySelectorAll(".opt");
      btns[idx].className = "opt wrong";
      btns[idx].disabled = true;
      var wrongWho = (pick.p1 !== a1) ? 0 : 1;
      fb.innerHTML = "<b style=\"color:var(--improve)\">Not quite.</b> Look again at " +
        exName(wrongWho) + ". Compare their payoff here with their payoff in " +
        (wrongWho === 0 ? "the other row" : "the other column") +
        ", holding the other executive fixed. Only that player's own payoff matters " +
        "for this test.";
      return;
    }

    answered = true;
    resolved[key(i, j)] = true;
    paintBoard();

    // The options are replaced by a record of the choice, so the matrix and the
    // explanation stay on screen together.
    var ne = isNE(i, j);
    var rows, verdict;

    if (ne) {
      // For an equilibrium we have to state that the condition holds for both.
      rows = ineqRow(0, i, j) + ineqRow(1, i, j);
      verdict = "<div class=\"verdict\">Both conditions hold, and for an equilibrium " +
                "they must: the definition asks about <i>every</i> player. So " +
                "<b class=\"ne\">" + profName(i, j) + " is a Nash equilibrium</b>. " +
                "Both inequalities are strict, so it is a strict Nash equilibrium.</div>";
    } else {
      // For a failure we only need to exhibit a player for whom the condition fails.
      rows = "";
      if (a1) { rows += ineqRow(0, i, j); }
      if (a2) { rows += ineqRow(1, i, j); }
      var whoTxt = (a1 && a2)
        ? "Both executives have a profitable change available, though finding one " +
          "would have been enough."
        : "That one executive is enough. The definition has to hold for every player, " +
          "so a single profitable change rules the profile out. There is no need to " +
          "check the other executive.";
      verdict = "<div class=\"verdict\">" + whoTxt + " So <b class=\"no\">" +
                profName(i, j) + " is not a Nash equilibrium</b>.</div>";
    }

    document.getElementById("opts").outerHTML =
      "<p class=\"chosen\"><span class=\"lab\">Your answer:</span> " + pick.text + "</p>";
    document.getElementById("fb").innerHTML = rows + verdict;

    nextBtn.disabled = false;
    nextBtn.textContent = (step === STEPS.length - 1) ? "See the conclusion" : "Next profile";
    nextBtn.focus();
  }

  function finish() {
    paintBoard();
    stepText.textContent = "All 4 profiles checked";
    nextBtn.disabled = true;
    qbox.innerHTML =
      "<h3>Every profile has been tested</h3>" +
      "<p class=\"stem\">Three profiles had an executive who could do better by " +
      "changing alone. One did not. That single survivor is the Nash equilibrium, and " +
      "because we checked all four, we know there are no others.</p>" +
      "<div class=\"summary\"><b>(talk, talk) is the only Nash equilibrium.</b> " +
      "Notice what that does not mean. Both executives prefer (refuse, refuse), which " +
      "pays " + pairText(PAY[0][0]) + " instead of " + pairText(PAY[1][1]) + ". " +
      "Neither can get there by changing strategy alone, so the game is stuck at the " +
      "outcome they both like less. Notice also that Chapter 2 found (talk, talk) by " +
      "eliminating dominated strategies. Inspection has just reached the same answer " +
      "a second way.</div>";
  }

  nextBtn.addEventListener("click", function () {
    step += 1;
    render();
  });
  document.getElementById("restart").addEventListener("click", function () {
    step = 0;
    resolved = {};
    answered = false;
    nextBtn.textContent = "Next profile";
    render();
  });

  buildBoard();
  render();
})();
</script>

</body>
</html>
