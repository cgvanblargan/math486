\begin{equation*}
\pi_1\bigl(q_1, b(q_1)\bigr)
= \bigl(141 - (73 - \tfrac{1}{2}q_1)\bigr)q_1 - q_1^2
= 68q_1 - \tfrac{1}{2}q_1^2.
\end{equation*}
